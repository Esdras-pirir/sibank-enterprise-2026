<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIBank Enterprise 2026 — Acceso Administrativo</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Spectral:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0B1320;
            --bg-card: #111C2E;
            --accent-gold: #C9A227;
            --accent-gold-hover: #E4C866;
            --text-main: #F4F6F9;
            --text-muted: #8A9BA8;
            --border-color: #1E2D42;
            --danger: #B32D2E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'IBM Plex Sans', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(to right, rgba(201, 162, 39, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(201, 162, 39, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-header .badge {
            display: inline-block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-gold);
            background: rgba(201, 162, 39, 0.1);
            padding: 4px 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .brand-header h1 {
            font-family: 'Spectral', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .brand-header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: #0B1320;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent-gold);
            color: #0B1320;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--accent-gold-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .alert-error {
            background: rgba(179, 45, 46, 0.15);
            border: 1px solid var(--danger);
            color: #ff9999;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .footer-note a {
            color: var(--accent-gold);
            text-decoration: none;
        }
        .footer-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="brand-header">
            <span class="badge">Área Restringida</span>
            <h1>SIBank Admin</h1>
            <p>Control Central & Gestión Operativa</p>
        </div>

        <div id="errorAlert" class="alert-error"></div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="username">Usuario de Empleado / Admin</label>
                <input type="text" id="username" class="form-control" placeholder="Ej. admin" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="btnLogin" class="btn-submit">Ingresar al Sistema</button>
        </form>

        <div class="footer-note">
            ¿Eres cliente? <a href="index.html">Ir al Portal de Clientes</a>
        </div>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const btnLogin = document.getElementById('btnLogin');
            const errorAlert = document.getElementById('errorAlert');

            errorAlert.style.display = 'none';
            btnLogin.disabled = true;
            btnLogin.textContent = 'Verificando credenciales...';

            try {
                const response = await fetch('http://127.0.0.1:8080/usuarios/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                if (!response.ok) {
                    throw new Error('Credenciales inválidas o error en el servidor.');
                }

                let data = await response.json();
                if (Array.isArray(data)) data = data[0];

                const isSuccess = data && (data.estado === 'OK' || data.estado === 'SUCCESS' || data.idUsuario);
                if (!isSuccess) {
                    throw new Error(data.mensaje || 'Usuario o contraseña incorrectos.');
                }

                if (data.idCliente !== null && data.idCliente !== undefined) {
                    throw new Error('Acceso denegado: Este portal es exclusivamente para personal administrativo.');
                }

                sessionStorage.setItem('sibank_admin_user', usernameInput);
                sessionStorage.setItem('sibank_admin_rol', data.rol || 'ADMINISTRADOR');
                sessionStorage.setItem('sibank_admin_id', data.idUsuario || '');

                window.location.href = 'admin-dashboard.html';

            } catch (err) {
                console.error("Error en Login:", err);
                errorAlert.textContent = err.message || 'No se pudo conectar con la API.';
                errorAlert.style.display = 'block';
                btnLogin.disabled = false;
                btnLogin.textContent = 'Ingresar al Sistema';
            }
        });
    </script>
</body>
</html>
